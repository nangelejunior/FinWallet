services:
  postgres:
    image: postgres:17-alpine
    container_name: finwallet-postgres
    environment:
      POSTGRES_DB: finwallet
      POSTGRES_USER: finwallet
      POSTGRES_PASSWORD: finwallet_dev
    ports:
      - "5432:5432"
    volumes:
      - finwallet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finwallet -d finwallet"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  summary-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finwallet_daily
      POSTGRES_USER: finwallet_daily
      POSTGRES_PASSWORD: finwallet_daily_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - finwallet_summary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finwallet_daily -d finwallet_daily"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    container_name: finwallet-postgres-test
    environment:
      POSTGRES_DB: finwallet_test
      POSTGRES_USER: finwallet_test
      POSTGRES_PASSWORD: finwallet_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finwallet_test -d finwallet_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: finwallet
      RABBITMQ_DEFAULT_PASS: finwallet_dev_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  finwallet_summary_data:
  finwallet_postgres_data:
  rabbitmq_data:
